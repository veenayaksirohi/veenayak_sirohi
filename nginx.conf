server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /veenayak_sirohi {
        return 301 /veenayak_sirohi/;
    }

    location ^~ /veenayak_sirohi/ {
        rewrite ^/veenayak_sirohi/(.*)$ /$1 break;
        try_files $uri $uri/ $uri.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}