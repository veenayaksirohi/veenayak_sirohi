services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    develop:
      watch:
        - action: rebuild
          path: app
        - action: rebuild
          path: components
        - action: rebuild
          path: public
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: next.config.js
        - action: rebuild
          path: tailwind.config.ts
        - action: rebuild
          path: postcss.config.mjs
        - action: rebuild
          path: tsconfig.json
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: nginx.conf
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
